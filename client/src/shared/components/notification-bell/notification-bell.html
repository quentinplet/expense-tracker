<button
  type="button"
  (click)="op.toggle($event); onOpen()"
  [attr.aria-label]="'topbar.notifications' | translate"
  class="relative flex h-11 w-11 cursor-pointer items-center justify-center rounded-lg border border-surface-200 text-lg text-surface-500 dark:text-surface-400 transition-colors hover:text-surface-800 dark:border-surface-800 dark:hover:text-surface-100"
>
  <i class="pi pi-bell"></i>
  @if (notificationService.unreadCount() > 0) {
    <span
      class="absolute -top-1 -right-1 flex h-4 min-w-4 items-center justify-center rounded-full bg-red-500 px-1 text-[0.65rem] font-semibold text-white"
    >
      {{ badgeCount() }}
    </span>
  }
</button>

<!--
  appendTo="body" : rendu dans la navbar, l'overlay vit dans le conteneur
  overflow-y-auto du main-layout — même piège que le p-menu du profil
  (f873797) : le focus posé à l'ouverture y déclenche un scroll, que le
  scroll-handler de l'overlay interprète comme une demande de fermeture.
-->
<p-popover #op appendTo="body" styleClass="notification-popover">
  <ng-template #content>
    <div class="flex w-80 flex-col">
      <div
        class="flex items-center justify-between gap-2 border-b border-surface-200 px-4 py-3 dark:border-surface-800"
      >
        <h3 class="m-0 text-sm font-semibold text-surface-900 dark:text-surface-0">
          {{ 'notifications.title' | translate }}
        </h3>
        @if (notificationService.unreadCount() > 0) {
          <button
            type="button"
            (click)="markAllAsRead()"
            class="cursor-pointer border-0 bg-transparent p-0 text-xs font-medium text-primary hover:underline"
          >
            {{ 'notifications.markAllRead' | translate }}
          </button>
        }
      </div>

      <div class="max-h-96 overflow-y-auto">
        @if (notificationService.notifications().length) {
          <ul class="m-0 list-none divide-y divide-surface-200 p-0 dark:divide-surface-800">
            @for (notification of notificationService.notifications(); track notification.id) {
              <li
                class="group flex items-start transition-colors hover:bg-surface-100 dark:hover:bg-surface-800"
              >
                <button
                  type="button"
                  (click)="onSelect(notification)"
                  class="flex min-w-0 flex-1 cursor-pointer items-start gap-3 border-0 bg-transparent px-4 py-3 text-left"
                >
                  <span
                    class="flex h-8 w-8 shrink-0 items-center justify-center rounded-lg"
                    [class]="
                      notification.type === 'RecurringTransactionGenerated'
                        ? 'bg-primary/15 text-primary'
                        : 'bg-red-500/15 text-red-500'
                    "
                  >
                    <i class="pi text-sm" [class]="iconFor(notification)"></i>
                  </span>

                  <span class="min-w-0 flex-1">
                    <span
                      class="block text-sm"
                      [class]="
                        notification.isRead
                          ? 'text-surface-600 dark:text-surface-300'
                          : 'font-semibold text-surface-900 dark:text-surface-0'
                      "
                    >
                      {{ textFor(notification) }}
                    </span>
                    <span class="mt-0.5 block text-xs text-surface-500 dark:text-surface-400">
                      @if (notification.type === 'RecurringTransactionGenerated') {
                        {{
                          notification.transactionAmount
                            | currency: 'EUR' : 'symbol' : '1.2-2' : locale()
                        }}
                        ·
                      }
                      {{ notification.createdAt | date: 'short' : undefined : locale() }}
                    </span>
                  </span>

                  @if (!notification.isRead) {
                    <span class="mt-1.5 h-2 w-2 shrink-0 rounded-full bg-primary"></span>
                  }
                </button>

                <!-- Sibling du bouton principal, pas imbriqué : un <button> dans un
                     <button> est invalide en HTML (§ notification-bell.ts). Visible
                     au survol seulement, pour ne pas alourdir la ligne en permanence. -->
                <button
                  type="button"
                  (click)="onDismiss(notification, $event)"
                  [attr.aria-label]="'notifications.dismiss' | translate"
                  class="mt-3 mr-3 shrink-0 cursor-pointer rounded border-0 bg-transparent p-1 text-surface-400 opacity-0 transition-opacity group-hover:opacity-100 hover:text-surface-700 dark:hover:text-surface-200"
                >
                  <i class="pi pi-times text-xs"></i>
                </button>
              </li>
            }
          </ul>
        } @else {
          <p class="px-4 py-8 text-center text-sm text-surface-500 dark:text-surface-400">
            {{ 'notifications.empty' | translate }}
          </p>
        }
      </div>
    </div>
  </ng-template>
</p-popover>
