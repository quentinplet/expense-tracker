<nav
  class="sticky top-0 z-40 flex h-16 items-center gap-2 border-b border-surface-200 bg-surface-0 px-4 dark:border-surface-800 dark:bg-surface-900"
>
  @if (busyService.busyRequestCount() > 0) {
    <p-progressspinner
      [style]="{ width: '1.5rem', height: '1.5rem' }"
      strokeWidth="4"
      [attr.aria-label]="'common.loading' | translate"
    />
  }

  <div class="ml-auto flex items-center gap-4">
    <app-language-switch />

    <button
      type="button"
      (click)="themeService.toggle()"
      [attr.aria-label]="'topbar.toggleTheme' | translate"
      class="flex h-11 w-11 cursor-pointer items-center justify-center rounded-lg border border-surface-200 text-lg text-surface-500 dark:text-surface-400 transition-colors hover:text-surface-800 dark:border-surface-800 dark:hover:text-surface-100"
    >
      <i
        class="pi"
        [class.pi-moon]="themeService.current() === 'light'"
        [class.pi-sun]="themeService.current() === 'dark'"
      ></i>
    </button>

    <app-notification-bell />

    <button
      type="button"
      (click)="menu.toggle($event)"
      [attr.aria-label]="'profileMenu.profile' | translate"
      class="flex h-11 w-11 cursor-pointer items-center justify-center rounded-full bg-primary text-base font-semibold text-primary-contrast"
    >
      {{ initials() }}
    </button>
    <!--
      appendTo="body" : rendu dans la navbar, l'overlay vit dans le conteneur
      overflow-y-auto du main-layout. Le focus que PrimeNG pose sur la liste à
      l'ouverture y déclenche un scroll, et le scroll-handler de l'overlay
      referme aussitôt le menu.
    -->
    <p-menu #menu [model]="menuItems()" [popup]="true" appendTo="body" />
  </div>
</nav>
