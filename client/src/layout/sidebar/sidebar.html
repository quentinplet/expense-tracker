<aside
  class="flex h-full w-64 flex-col border-r border-surface-200 bg-surface-0 dark:border-surface-800 dark:bg-surface-900"
>
  <a
    routerLink="/dashboard"
    class="flex shrink-0 items-center gap-3 border-b border-surface-200 px-5 py-3 no-underline dark:border-surface-800"
  >
    <span
      class="flex h-9 w-9 shrink-0 items-center justify-center rounded-xl bg-primary text-primary-contrast"
    >
      <i class="pi pi-wallet"></i>
    </span>
    <span class="flex min-w-0 flex-col">
      <span class="truncate text-base font-bold text-surface-900 dark:text-surface-0">
        {{ 'app.name' | translate }}
      </span>
      <span class="truncate text-xs text-surface-500 dark:text-surface-400">
        {{ 'app.tagline' | translate }}
      </span>
    </span>
  </a>

  <nav class="min-h-0 flex-1 overflow-y-auto px-3 pt-4 pb-3">
    <ul class="m-0 flex list-none flex-col gap-4 p-0">
      @for (item of menuItems; track item.route) {
        <li>
          @if (item.available) {
            <a
              [routerLink]="item.route"
              routerLinkActive="!bg-primary/10 !text-primary"
              class="flex items-center gap-3 rounded-lg px-3 py-3.5 text-sm font-medium text-surface-600 no-underline transition-colors hover:bg-surface-100 dark:text-surface-300 dark:hover:bg-surface-800"
            >
              <i [class]="item.icon"></i>
              <span>{{ item.labelKey | translate }}</span>
            </a>
          } @else {
            <span
              aria-disabled="true"
              class="flex cursor-not-allowed items-center gap-3 rounded-lg px-3 py-3.5 text-sm font-medium text-surface-400 opacity-60 dark:text-surface-500"
            >
              <i [class]="item.icon"></i>
              <span>{{ item.labelKey | translate }}</span>
            </span>
          }
        </li>
      }
    </ul>
  </nav>

  <div class="shrink-0 border-t border-surface-200 p-3 dark:border-surface-800">
    <button
      type="button"
      (click)="profileMenu.toggle($event)"
      [attr.aria-label]="'profileMenu.profile' | translate"
      class="flex w-full cursor-pointer items-center gap-3 rounded-xl border-0 bg-surface-100 px-3 py-2.5 text-left transition-colors hover:bg-surface-200 dark:bg-surface-950 dark:hover:bg-surface-800"
    >
      <span
        class="flex h-9 w-9 shrink-0 items-center justify-center rounded-full bg-primary text-sm font-semibold text-primary-contrast"
      >
        {{ initials() }}
      </span>
      <span class="min-w-0 flex-1">
        <span class="block truncate text-sm font-semibold text-surface-900 dark:text-surface-0">
          {{ accountService.fullName() }}
        </span>
        <span class="block truncate text-xs text-surface-500 dark:text-surface-400">
          {{ accountService.currentUser()?.email }}
        </span>
      </span>
      <i class="pi pi-ellipsis-v shrink-0 text-surface-400 dark:text-surface-500"></i>
    </button>
    <!-- appendTo="body" : rendu en place, l'overlay serait clippé par l'aside et
         se refermerait sur le scroll déclenché par son propre focus d'ouverture. -->
    <p-menu #profileMenu [model]="profileMenuItems()" [popup]="true" appendTo="body" />
  </div>
</aside>
