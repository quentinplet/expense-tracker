<div class="mx-auto flex max-w-7xl flex-col gap-6">
  <header class="flex flex-wrap items-start justify-between gap-4">
    <div>
      <h1 class="m-0 text-3xl font-bold text-surface-900 dark:text-surface-0">
        {{ 'dashboard.title' | translate }}
      </h1>
      <p class="mt-1 mb-0 text-sm text-surface-500">{{ 'dashboard.subtitle' | translate }}</p>
    </div>

    <app-month-navigator
      [month]="currentMonth()"
      [busy]="loading()"
      (previous)="goToPreviousMonth()"
      (next)="goToNextMonth()"
    />
  </header>

  @if (failed()) {
    <div
      class="rounded-2xl border border-surface-200 bg-surface-0 p-10 text-center dark:border-surface-800 dark:bg-surface-950"
    >
      <p class="m-0 text-sm text-surface-500">{{ 'common.retry' | translate }}</p>
    </div>
  } @else if (data(); as dashboard) {
    @if (hasNoHistory()) {
      <!-- Aucune donnée nulle part : message d'accueil. -->
      <div
        class="rounded-2xl border border-surface-200 bg-surface-0 p-12 text-center dark:border-surface-800 dark:bg-surface-950"
      >
        <h2 class="m-0 text-lg font-semibold text-surface-900 dark:text-surface-0">
          {{ 'dashboard.empty.title' | translate }}
        </h2>
        <p class="mx-auto mt-2 mb-0 max-w-md text-sm text-surface-500">
          {{ 'dashboard.empty.hint' | translate }}
        </p>
      </div>
    } @else {
      <app-kpi-cards [totals]="dashboard.totals" [month]="currentMonth()" />

      <div class="grid grid-cols-1 gap-4 lg:grid-cols-5">
        <div class="lg:col-span-2">
          <app-category-donut
            [breakdown]="dashboard.breakdown"
            [monthExpenses]="dashboard.totals.expenses"
          />
        </div>
        <div class="lg:col-span-3">
          <app-trend-chart [trend]="dashboard.trend" />
        </div>
      </div>

      <app-recent-transactions [transactions]="dashboard.recentTransactions" />
    }
  }
</div>
