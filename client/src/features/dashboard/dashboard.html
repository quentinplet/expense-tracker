<div class="mx-auto flex max-w-7xl flex-col gap-6">
  <header class="flex flex-wrap items-start justify-between gap-4">
    <div>
      <h1 class="m-0 text-3xl font-bold text-surface-900 dark:text-surface-0">
        {{ greeting().key | translate: { name: greeting().name } }}
      </h1>
      <p class="mt-1 mb-0 text-sm text-surface-500 dark:text-surface-400">
        {{
          'dashboard.overviewFor'
            | translate: { date: today | date: 'longDate' : undefined : locale() }
        }}
      </p>
    </div>

    <app-period-selector
      [month]="currentMonth()"
      [busy]="loading()"
      (monthChange)="setMonth($event)"
    />
  </header>

  @if (failed()) {
    <div
      class="rounded-2xl border border-surface-200 bg-surface-0 p-10 text-center dark:border-surface-800 dark:bg-surface-900"
    >
      <p class="m-0 text-sm text-surface-500 dark:text-surface-400">
        {{ 'common.retry' | translate }}
      </p>
    </div>
  } @else if (data(); as dashboard) {
    <!-- Aucune transaction, jamais : les widgets restent affichés, chacun avec son
         propre état à zéro (§ category-donut/trend-chart/recent-transactions) plutôt
         qu'un écran d'accueil qui les remplacerait tous. -->
    <app-kpi-cards
      [totals]="dashboard.totals"
      [cumulativeNet]="dashboard.cumulativeNet"
      [month]="currentMonth()"
    />

    <!-- Sans items-start : les deux cartes s'étirent à la même hauteur. Sûr depuis que
         la boîte du graphique est en h-[224px] fixe (§ trend-chart.html) — un flex-grow
         par défaut à 0 ne l'étire jamais, l'espace en trop reste sous le graphique. -->
    <div class="grid grid-cols-1 gap-4 lg:grid-cols-3">
      <div class="lg:col-span-2">
        <app-trend-chart [dailyTrend]="dashboard.dailyTrend" [trend]="dashboard.trend" />
      </div>
      <app-quick-actions class="h-full" />
    </div>

    <!-- items-start : la liste des budgets grandit avec le nombre de budgets suivis
         ce mois-ci (jusqu'à 5 lignes) ; sans ça, elle tirait aussi Breakdown vers le
         bas alors que l'anneau, lui, a une taille fixe — du vide sans utilité. -->
    <div class="grid grid-cols-1 items-start gap-4 lg:grid-cols-2">
      <app-category-donut
        [monthBreakdown]="dashboard.breakdown"
        [allTimeBreakdown]="dashboard.breakdownAllTime"
        [monthExpenses]="dashboard.totals.expenses"
        [allTimeExpenses]="dashboard.allTimeExpenses"
      />
      <app-budgets-summary [budgets]="budgets()" [month]="currentMonth()" />
    </div>

    <!-- Les récentes ignorent volontairement la période sélectionnée. -->
    <div class="grid grid-cols-1 gap-4 lg:grid-cols-5">
      <div class="lg:col-span-3">
        <app-recent-transactions [transactions]="dashboard.recentTransactions" class="block h-full" />
      </div>
      <div class="lg:col-span-2">
        <app-recurring-summary
          [recurringTransactions]="recurringTransactions()"
          class="block h-full"
        />
      </div>
    </div>
  }
</div>
