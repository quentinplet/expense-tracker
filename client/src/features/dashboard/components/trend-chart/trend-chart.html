<div
  class="flex h-full flex-col rounded-2xl border border-surface-200 bg-surface-0 p-5 dark:border-surface-800 dark:bg-surface-900"
>
  <div class="flex flex-wrap items-center justify-between gap-3">
    <h2 class="m-0 text-base font-semibold text-surface-900 dark:text-surface-0">
      {{ 'dashboard.trend.title' | translate }}
    </h2>

    <div class="flex flex-wrap items-center gap-4">
      <!-- Légende en HTML plutôt que dans le canvas, pour qu'elle suive thème et langue. -->
      <div class="flex items-center gap-4 text-xs text-surface-500 dark:text-surface-400">
        <span class="flex items-center gap-1.5">
          <span class="h-0.5 w-3 rounded" [style.background-color]="incomeColor"></span>
          {{ 'dashboard.trend.income' | translate }}
        </span>
        <span class="flex items-center gap-1.5">
          <span class="h-0.5 w-3 rounded" [style.background-color]="expenseColor"></span>
          {{ 'dashboard.trend.expenses' | translate }}
        </span>
      </div>

      <div
        class="flex items-center gap-0.5 rounded-lg bg-surface-100 p-0.5 dark:bg-surface-950"
        role="group"
      >
        <button
          type="button"
          (click)="scope.set('month')"
          [attr.aria-pressed]="scope() === 'month'"
          class="cursor-pointer rounded-md px-2.5 py-1 text-xs font-medium transition-colors"
          [class]="
            scope() === 'month'
              ? 'bg-surface-0 text-surface-900 dark:bg-surface-900 dark:text-surface-0'
              : 'text-surface-500 hover:text-surface-900 dark:text-surface-400 dark:hover:text-surface-0'
          "
        >
          {{ 'dashboard.scope.month' | translate }}
        </button>
        <button
          type="button"
          (click)="scope.set('all')"
          [attr.aria-pressed]="scope() === 'all'"
          class="cursor-pointer rounded-md px-2.5 py-1 text-xs font-medium transition-colors"
          [class]="
            scope() === 'all'
              ? 'bg-surface-0 text-surface-900 dark:bg-surface-900 dark:text-surface-0'
              : 'text-surface-500 hover:text-surface-900 dark:text-surface-400 dark:hover:text-surface-0'
          "
        >
          {{ 'dashboard.scope.all' | translate }}
        </button>
      </div>
    </div>
  </div>

  <!-- Boîte à hauteur constante : l'état vide occupe exactement la place du graphique,
       donc la carte ne change pas de taille en basculant de portée — et la carte
       voisine, qui partage la même ligne de grille, ne bouge pas non plus.
       h-[224px], pas h-56 : la racine de l'app est à font-size 14px (Sakai), donc
       14rem (h-56) vaut 196px et non 224px — un écart de 28px avec le height="224px"
       du canvas Chart.js juste en dessous, qui débordait de la carte. -->
  <div class="mt-4 h-[224px]">
    <!-- Toujours le graphique, même sans aucune donnée : à zéro partout, Chart.js
         trace juste une ligne plate — un vrai graphique vide, pas un texte à la place. -->
    <p-chart type="line" [data]="chartData()" [options]="chartOptions()" height="224px" />
  </div>
</div>
