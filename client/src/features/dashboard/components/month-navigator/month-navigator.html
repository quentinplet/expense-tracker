<div
  class="flex items-center gap-1 rounded-xl border border-surface-200 bg-surface-0 p-1 dark:border-surface-800 dark:bg-surface-950"
>
  <button
    type="button"
    (click)="previous.emit()"
    [disabled]="busy()"
    [attr.aria-label]="'common.previousMonth' | translate"
    class="flex h-8 w-8 items-center justify-center rounded-lg text-surface-500 transition-colors not-disabled:cursor-pointer hover:text-surface-900 disabled:opacity-40 dark:hover:text-surface-0"
  >
    <i class="pi pi-chevron-left text-xs"></i>
  </button>

  <span
    class="min-w-32 text-center text-sm font-semibold text-surface-900 capitalize dark:text-surface-0"
  >
    {{ date() | date: 'MMMM y' : undefined : locale() }}
  </span>

  <button
    type="button"
    (click)="next.emit()"
    [disabled]="busy() || atCurrentMonth()"
    [attr.aria-label]="'common.nextMonth' | translate"
    class="flex h-8 w-8 items-center justify-center rounded-lg text-surface-500 transition-colors not-disabled:cursor-pointer hover:text-surface-900 disabled:opacity-40 dark:hover:text-surface-0"
  >
    <i class="pi pi-chevron-right text-xs"></i>
  </button>
</div>
