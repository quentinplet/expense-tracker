<div
  class="flex items-center gap-1 rounded-xl border border-surface-200 bg-surface-0 p-1 dark:border-surface-800 dark:bg-surface-950"
>
  <button
    type="button"
    (click)="shift(-1)"
    [disabled]="busy()"
    [attr.aria-label]="'common.previousMonth' | translate"
    class="flex h-8 w-8 items-center justify-center rounded-lg text-surface-500 transition-colors not-disabled:cursor-pointer hover:text-surface-900 disabled:opacity-40 dark:text-surface-400 dark:hover:text-surface-0"
  >
    <i class="pi pi-chevron-left text-xs"></i>
  </button>

  <!-- Le picker évite les douze clics nécessaires pour remonter d'un an. -->
  <p-datepicker
    view="month"
    dateFormat="MM yy"
    [ngModel]="pickerDate()"
    (ngModelChange)="onPickerChange($event)"
    [maxDate]="maxDate()"
    [readonlyInput]="true"
    [showIcon]="true"
    iconDisplay="input"
    [disabled]="busy()"
    styleClass="w-44"
    inputStyleClass="!border-0 !bg-transparent !text-sm !font-semibold text-center"
  />

  <button
    type="button"
    (click)="shift(1)"
    [disabled]="busy() || atCurrentMonth()"
    [attr.aria-label]="'common.nextMonth' | translate"
    class="flex h-8 w-8 items-center justify-center rounded-lg text-surface-500 transition-colors not-disabled:cursor-pointer hover:text-surface-900 disabled:opacity-40 dark:text-surface-400 dark:hover:text-surface-0"
  >
    <i class="pi pi-chevron-right text-xs"></i>
  </button>
</div>
