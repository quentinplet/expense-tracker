<form [formGroup]="form" (ngSubmit)="onSubmit()" class="flex flex-col gap-5">
  <p class="m-0 text-sm text-surface-600 dark:text-surface-300">
    {{ 'import.mapping.hint' | translate }}
  </p>

  <div class="grid grid-cols-1 gap-4 sm:grid-cols-2">
    <div>
      <label class="mb-2 block text-sm font-semibold">{{ 'import.mapping.dateColumn' | translate }}</label>
      <p-select
        formControlName="dateColumn"
        [options]="columnOptions()"
        optionLabel="label"
        optionValue="value"
        [placeholder]="'import.mapping.selectColumn' | translate"
        [invalid]="submitted() && !form.controls.dateColumn.value"
        appendTo="body"
        fluid
      />
    </div>
    <div>
      <label class="mb-2 block text-sm font-semibold">{{ 'import.mapping.labelColumn' | translate }}</label>
      <p-select
        formControlName="labelColumn"
        [options]="columnOptions()"
        optionLabel="label"
        optionValue="value"
        [placeholder]="'import.mapping.selectColumn' | translate"
        [invalid]="submitted() && !form.controls.labelColumn.value"
        appendTo="body"
        fluid
      />
    </div>
  </div>

  <div>
    <label class="mb-2 block text-sm font-semibold">{{ 'import.mapping.amountMode' | translate }}</label>
    <div
      class="flex items-center gap-1 rounded-full border border-surface-200 bg-surface-100 p-1 dark:border-surface-800 dark:bg-surface-950"
      role="group"
    >
      @for (option of amountModeOptions; track option.value) {
        <button
          type="button"
          (click)="form.controls.amountMode.setValue(option.value)"
          [attr.aria-pressed]="form.controls.amountMode.value === option.value"
          class="flex-1 cursor-pointer rounded-full border-0 px-4 py-2 text-sm font-semibold transition-colors"
          [class]="
            form.controls.amountMode.value === option.value
              ? 'bg-surface-0 text-surface-900 shadow-sm dark:bg-surface-800 dark:text-surface-0'
              : 'bg-transparent text-surface-500 hover:text-surface-800 dark:text-surface-400 dark:hover:text-surface-100'
          "
        >
          {{ option.labelKey | translate }}
        </button>
      }
    </div>
  </div>

  @if (!isDebitCredit) {
    <div>
      <label class="mb-2 block text-sm font-semibold">{{ 'import.mapping.amountColumn' | translate }}</label>
      <p-select
        formControlName="amountColumn"
        [options]="columnOptions()"
        optionLabel="label"
        optionValue="value"
        [placeholder]="'import.mapping.selectColumn' | translate"
        [invalid]="submitted() && amountIncomplete"
        appendTo="body"
        fluid
      />
    </div>
  } @else {
    <div class="grid grid-cols-1 gap-4 sm:grid-cols-2">
      <div>
        <label class="mb-2 block text-sm font-semibold">{{ 'import.mapping.debitColumn' | translate }}</label>
        <p-select
          formControlName="debitColumn"
          [options]="columnOptions()"
          optionLabel="label"
          optionValue="value"
          [placeholder]="'import.mapping.selectColumn' | translate"
          [invalid]="submitted() && amountIncomplete"
          appendTo="body"
          fluid
        />
      </div>
      <div>
        <label class="mb-2 block text-sm font-semibold">{{ 'import.mapping.creditColumn' | translate }}</label>
        <p-select
          formControlName="creditColumn"
          [options]="columnOptions()"
          optionLabel="label"
          optionValue="value"
          [placeholder]="'import.mapping.selectColumn' | translate"
          [invalid]="submitted() && amountIncomplete"
          appendTo="body"
          fluid
        />
      </div>
    </div>
  }

  <div class="grid grid-cols-1 gap-4 sm:grid-cols-2">
    <div>
      <label class="mb-2 block text-sm font-semibold">{{ 'import.mapping.dateFormat' | translate }}</label>
      <input pInputText formControlName="dateFormat" type="text" fluid />
    </div>
    <div>
      <label class="mb-2 block text-sm font-semibold">{{ 'import.mapping.cultureName' | translate }}</label>
      <input pInputText formControlName="cultureName" type="text" fluid />
    </div>
  </div>

  <div class="flex justify-between">
    <p-button
      type="button"
      [label]="'common.cancel' | translate"
      severity="secondary"
      outlined
      (click)="back.emit()"
    />
    <p-button type="submit" [label]="'import.mapping.submit' | translate" [loading]="loading()" />
  </div>
</form>
